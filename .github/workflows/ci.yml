name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nessun permesso di scrittura: il workflow non tocca il repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Le action di terze parti sono pinnate al commit SHA, non al tag: un tag e
# mutabile e chi lo controlla puo spostarlo su codice diverso da quello verificato.
jobs:
  quality:
    name: Lint e analisi statica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, imagick, zip, bcmath, pdo_mysql, exif
          coverage: none

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint
        run: ./vendor/bin/pint --test

      - name: PHPStan
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  tests:
    name: Test
    runs-on: ubuntu-latest
    services:
      mariadb:
        # stessa major della produzione: MySQL e MariaDB divergono sulle funzioni
        # spaziali e sull'ordine degli assi con SRID 4326
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: eventi_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, imagick, zip, bcmath, pdo_mysql, exif
          coverage: none

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      # `mariadb-client` e non il `mysqldump` gia' presente sull'immagine:
      # quello e' il client di MySQL 8, che contro un server MariaDB fallisce
      # su `--column-statistics` — un'opzione che MySQL manda di suo e MariaDB
      # non conosce. Il dump esce con stato 1 e il backup non viene creato.
      # Spatie cerca `mariadb-dump` per primo su una connessione `mariadb`.
      - name: Client MariaDB per il dump del database
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client

      - name: Prepara ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pest
        run: ./vendor/bin/pest --ci
        env:
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: eventi_test
          DB_USERNAME: root
          DB_PASSWORD: root

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: eventi_lighthouse
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, imagick, zip, bcmath, pdo_mysql, exif
          coverage: none

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Prepara ambiente
        env:
          DB_DATABASE: eventi_lighthouse
          DB_PASSWORD: root
        run: |
          cp .env.example .env
          sed -i "s|^DB_PORT=.*|DB_PORT=3306|" .env
          sed -i "s|^DB_DATABASE=.*|DB_DATABASE=${DB_DATABASE}|" .env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=${DB_PASSWORD}|" .env
          sed -i "s|^APP_DEBUG=.*|APP_DEBUG=false|" .env
          sed -i "s|^APP_URL=.*|APP_URL=http://127.0.0.1:8080|" .env
          php artisan key:generate
          php artisan storage:link

      # Il sito misurato deve avere dentro qualcosa: una pagina vuota prende
      # novanta su novanta e non dice niente. Il seeder e' lo stesso della
      # demo, con centocinquanta date sui prossimi trenta giorni.
      - name: Popola il database
        run: php artisan migrate:fresh --seed --force

      # Le varianti WebP e AVIF nascono da lavori in coda (§12.1). Senza questo
      # passaggio il sito servirebbe le locandine originali e la misura
      # boccerebbe una pipeline che in produzione funziona: e' la differenza
      # fra novanta e settantacinque, verificata.
      - name: Genera le varianti delle immagini
        run: php artisan queue:work --stop-when-empty --tries=1 --quiet

      # Il server PHP di sviluppo non e' il prodotto: niente compressione,
      # niente intestazioni di cache, ogni immagine attraverso PHP. Davanti gli
      # si mette nginx, che e' cio' che fa il server vero. L'immagine del
      # runner non lo porta, e con lui arriva `/etc/nginx/mime.types`, a cui il
      # modello fa riferimento.
      - name: Installa nginx
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends nginx

      # Si avvia `php -S` a mano invece di `php artisan serve`, e non per
      # gusto: `artisan serve` e' un padre che legge lo standard output del
      # figlio attraverso una pipe, e quando la shell di QUESTO passo termina
      # la pipe si rompe. Da quel momento ogni risposta del sito esce con un
      # `Notice: Broken pipe` incollato davanti al `<!doctype>` — e Lighthouse
      # legge un `robots.txt` invalido e una pagina senza meta description.
      # Costava diciassette punti di SEO, e sembrava un difetto del sito.
      # Il router `server.php` legge `getcwd()`, quindi va lanciato da `public/`.
      - name: Avvia applicazione e server
        run: |
          mkdir -p "${RUNNER_TEMP}/nginx"
          sed -e "s|__ROOT__|${GITHUB_WORKSPACE}/public|g" \
              -e "s|__PORT__|8080|g" \
              -e "s|__APP_PORT__|8000|g" \
              -e "s|__MIME__|/etc/nginx/mime.types|g" \
              -e "s|__TMP__|${RUNNER_TEMP}/nginx|g" \
              .github/lighthouse/nginx.conf.template > "${RUNNER_TEMP}/nginx/nginx.conf"

          ROUTER=vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php
          ( cd public && PHP_CLI_SERVER_WORKERS=8 \
            nohup php -d variables_order=EGPCS -S 127.0.0.1:8000 "${GITHUB_WORKSPACE}/${ROUTER}" \
            > "${RUNNER_TEMP}/php-server.log" 2>&1 < /dev/null & )

          nohup nginx -c "${RUNNER_TEMP}/nginx/nginx.conf" -p "${RUNNER_TEMP}/nginx" \
            > "${RUNNER_TEMP}/nginx.log" 2>&1 < /dev/null &

          # `if` e non `[ ... ] && break`: sotto `set -e` una lista `&&` che
          # torna falsa come ultimo comando di un giro interrompe il passo, e
          # il fallimento sembrerebbe del server invece che dell'attesa.
          code=000
          for _ in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ || echo 000)
            if [ "$code" = "200" ]; then break; fi
            sleep 1
          done
          [ "$code" = "200" ] || { echo "Il sito non risponde: $code"; cat "${RUNNER_TEMP}/nginx.log"; exit 1; }

          # Una pagina servita bene non comincia con un avviso di PHP: se
          # succede, il resto della misura non vale niente.
          curl -sS http://127.0.0.1:8080/ | head -c 15 | grep -q '<!DOCTYPE html>' \
            || { echo "La pagina non comincia con il doctype: qualcosa scrive prima dell'HTML"; exit 1; }

      # Lo slug di un evento nasce dal seeder e cambia a ogni esecuzione:
      # scriverlo nella configurazione significherebbe misurare un 404. Il feed
      # RSS elenca le date future, e il suo primo collegamento e' una scheda
      # evento viva.
      - name: Scegli la scheda evento da misurare
        run: |
          url=$(curl -sS http://127.0.0.1:8080/feed.rss \
            | grep -oE '<link>[^<]+/eventi/[^<]+</link>' | head -1 | sed -E 's|</?link>||g')
          [ -n "$url" ] || { echo "Nessun evento nel feed: il seeder non ha popolato nulla"; exit 1; }
          echo "Scheda misurata: $url"
          echo "LHCI_EVENT_URL=$url" >> "$GITHUB_ENV"

      - name: Lighthouse CI
        env:
          LHCI_BASE_URL: http://127.0.0.1:8080
          LHCI_OUTPUT_DIR: ${{ runner.temp }}/lighthouse
        run: npx lhci autorun --config=lighthouserc.cjs

      # I referti restano allegati anche quando le soglie passano: e' la sola
      # traccia di com'era il sito il giorno in cui e' stato misurato.
      - name: Allega i referti
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lighthouse
          path: ${{ runner.temp }}/lighthouse
          retention-days: 14
          if-no-files-found: warn

  deploy:
    name: Deploy su eventi.fabiodalez.it
    # `lighthouse` NON e' fra le dipendenze, ed e' una scelta scritta in D37:
    # le soglie di §11.11 sono dichiarate come le vuole il piano, e LCP < 2s
    # oggi non lo raggiunge nessun ambiente — il solo TTFB della shared hosting
    # vale fra 0,6 e 3,0 secondi. Un criterio che nessuno soddisfa ancora non
    # deve tenere in ostaggio ogni rilascio; il referto resta rosso e allegato,
    # che e' il suo mestiere. Quando LCP scende sotto i due secondi, aggiungere
    # `lighthouse` qui e' una riga.
    needs: [quality, tests]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # PHP e composer qui non servono piu': le dipendenze di produzione le
      # installa il server, che e' l'unico posto dove la loro versione conta.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      # ------------------------------------------------------------------
      # Gli asset compilati vanno su un ramo dedicato, e il server li scarica.
      #
      # Compilarli sul server non si puo': Node cade all'avvio di Vite per i
      # limiti della shared hosting — `Aborted (core dumped)` dentro
      # `V8Platform::Initialize` — e quando non cade impiega piu' di dieci
      # minuti. Qui invece c'e' una macchina vera, e il risultato pesa poche
      # centinaia di chilobyte.
      #
      # Il ramo e' un artefatto, non una storia: ogni pubblicazione e' un
      # commit orfano che sostituisce il precedente. Non va unito da nessuna
      # parte e non va letto da nessuno.
      - name: Pubblica gli asset compilati
        run: |
          cd public/build
          git init -q
          git checkout -q -b assets
          git add -A
          git -c user.name="deploy" -c user.email="deploy@eventi.fabiodalez.it" \
            commit -q -m "asset compilati per ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" assets

      # ------------------------------------------------------------------
      # Il segnale al server.
      #
      # Qui NON si spinge niente: la porta 22 di quell'host non accetta
      # connessioni da fuori — ogni rsync moriva in `Connection timed out` — e
      # il deploy non ha mai funzionato per questo. Le connessioni in uscita
      # dal server invece passano, quindi e' lui a tirare: questa chiamata dice
      # solo «aggiornati», e a farlo e' `deploy:pull` dall'altra parte.
      #
      # `--fail-with-body` perche' un rilascio fallito deve rendere rosso
      # questo passo E mostrare cosa e' andato storto, non solo il codice HTTP.
      - name: Chiedi al server di aggiornarsi
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          DEPLOY_SECRET: ${{ secrets.DEPLOY_HOOK_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 900 \
            -X POST "${DEPLOY_URL}" \
            -H "X-Secret-Token: ${DEPLOY_SECRET}" \
            -H "Accept: application/json"
