name: Qualità approfondita

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep-quality:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [analyse:max, mutation]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, imagick, zip, bcmath, pdo_mysql, exif, sockets
          coverage: xdebug
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Analisi
        env:
          QUALITY_COMMAND: ${{ matrix.check }}
          XDEBUG_MODE: coverage
        run: |
          mkdir -p storage/logs
          set -o pipefail
          composer "$QUALITY_COMMAND" 2>&1 | tee storage/logs/deep-quality.txt
      - name: Referti
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quality-${{ strategy.job-index }}
          path: |
            storage/logs/deep-quality.txt
            storage/logs/infection*
          retention-days: 14
